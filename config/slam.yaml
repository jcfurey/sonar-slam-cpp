# ROS 2 parameter file. The "/**" wildcard applies these values to whatever node
# name loads the file. Angles that used the ROS 1 "deg()" rosparam helper are
# pre-converted to radians below.
/**:
  ros__parameters:
    # how often to add keyframes, this can be varied but between 1 and 4 meters is best
    keyframe_duration: 1.0
    keyframe_translation: 3.0
    keyframe_rotation: 0.5235987755982988   # deg(30)
    # A mechanical head sweep changes observable 3-D geometry even when the
    # vehicle is stationary. <= 0 disables angle-triggered keyframes.
    keyframe_head_rotation: 0.17453292519943295  # deg(10)
    # Open-water admission. Every graph candidate, including the first, must
    # carry enough finite returns distributed across distinct XYZ voxels
    # and azimuth bins. Rejected pings publish odometry-extrapolated pose only
    # and never enter keyframe/NSSM history.
    admission:
      min_points: 50
      cell_size: 0.5
      min_occupied_cells: 8
      azimuth_bin_size: 0.08726646259971647  # 5 deg
      min_azimuth_bins: 3

    # is the SLAM back-end enabled (vs. pure dead reckoning); overridden from launch
    enable_slam: true

    # false when an external node (e.g. a robot_localization map EKF fusing
    # the SLAM pose) owns the map->odom transform
    publish_tf: true
    # min seconds between O(history) graph-constraint marker rebuilds
    viz_min_period: 2.0

    # define the noise models
    # x, y, theta in m, m, rad
    prior_sigmas: [0.1, 0.1, 0.01]
    odom_sigmas: [0.2, 0.2, 0.02]
    icp_odom_sigmas: [0.1, 0.1, 0.01]

    # Legacy planar compatibility-mode ICP config. constrained_3d.enabled=true
    # uses the explicit matcher parameters below instead. Resolved to an
    # absolute path by the launch file; empty uses the package copy.
    icp_config: ""

    # sonar_proc candidate cloud + exact-stamp TF contract
    points_topic: /sensor/sonar/sonar0/proc_points
    odom_frame: odom
    base_frame: base_link
    tf_lookup_timeout: 0.05
    # Optional emergency/operator gate. <= 0 admits every angle into the
    # constrained-3D front end (the default).
    max_head_pitch: 0.0
    # DR yaw spike gate (rad/s over the inter-ping gap; 0 disables): drop a
    # ping whose odom yaw stepped faster than the vehicle can physically
    # turn — a compass/EKF glitch would otherwise become a hard yaw
    # odometry factor and a poisoned scan-match prior
    dr:
      max_yaw_rate: 1.5
    # conservative physical fan used only for NSSM target preselection
    sonar_max_range: 30.0
    sonar_horizontal_aperture: 2.2689280275926285

    # Downsample points for ICP/publishing
    point_resolution: 0.5
    # noise radius (m) used by the overlap tests and the global-init occupancy grid
    point_noise: 0.5
    # XYZ correspondences with a hard x/y/yaw motion model. Source elevation
    # is shifted into the target pressure-depth chart before registration;
    # sonar therefore cannot modify z, roll or pitch.
    constrained_3d:
      enabled: true
      max_correspondence: 0.75
      trim_ratio: 0.8
      max_iterations: 40
      translation_epsilon: 0.005
      rotation_epsilon: 0.001
      min_correspondences: 6
    # Sensor noise for the legacy planar point-to-point Censi helper. Censi is
    # rejected while constrained_3d is enabled; use sampled covariance there.
    censi_sensor_noise: 0.1
    # run the "sampled" method's cov_samples registrations across an OpenMP
    # per-thread ICP engine pool instead of one core sequentially
    parallel_cov_samples: true

    # Sequential scan matching (SSM)
    ssm:
      enable: true            # is this module enabled?
      min_points: 50          # the min number of points to try SSM
      max_translation: 3.0    # the max translation allowed
      max_rotation: 0.5235987755982988   # deg(30)
      # Disabled by default: DR yaw may be magnetically disturbed.
      max_yaw_vs_dr: 0.0
      target_frames: 3        # the number of frames we compare the current frame to
      # Sequential neighbors should share a meaningful fraction of the scan.
      # This complements the absolute count and rejects accidental overlap in
      # scattered water-column returns.
      min_overlap_ratio: 0.25
      # A converged ICP is admitted only when its covariance is present, finite,
      # compact and not strongly anisotropic. Failure falls back to fused odom.
      require_covariance: true
      max_sigma: 0.5
      max_anisotropy: 8.0
      degeneracy_prefloor: true
      initialization: true    # global scan-match init before ICP
      initialization_params: [50.0, 1.0, 0.01]   # [sobol n per iter, iters, refine ftol]
      # Must be > 0 while require_covariance is true: the sampled/censi
      # covariance only exists when cov_samples registrations run, and
      # Slam::configure() rejects the contradictory pair at startup (a 0 here
      # used to mean "fixed noise model", but that fallback no longer enters
      # the graph under require_covariance). 30 matches nssm and the e2e test.
      cov_samples: 30
      # sampled = many ICPs + FAST-MCD (default, and the recommended path).
      # `censi` is the legacy planar point-to-point closed form. It is rejected
      # in constrained-3D mode; in planar mode configure() also gates it
      # on the LOADED ICP chain via ICP::error_minimizer_name(), so it is
      # accepted against a PointToPoint minimizer and rejected against
      # PointToPlane. This package's config/icp.yaml ships point-to-plane, so
      # censi is rejected by default; a point-to-point override accepts it.
      # Even when the objectives match, Bonnabel et al. (ACC 2016) show the
      # closed form is optimistic for point-to-point ICP because it ignores
      # rematching — so censi is selectable, not validated.
      cov_method: sampled

    # Non-sequential scan matching
    nssm:
      enable: true            # is this module enabled?
      # Exclusion zone around the most recent keyframe. NOTE: with the shipped
      # min_revisit_sep (10, below) this no longer affects which frame becomes
      # the loop-closure TARGET — the revisit floor already excludes more. It
      # still gates when NSSM starts and bounds source_frames. See the
      # min_revisit_sep note; the node warns about this at startup.
      min_st_sep: 8
      min_points: 50          # min number of points
      max_translation: 10.0   # max translation allowed
      max_rotation: 1.0471975511965976   # deg(60)
      source_frames: 5        # the number of frames to aggregate when trying a loop closure
      # Candidate-fan padding inflates the anchor keyframe's fresh covariance by
      # (rate * frame_age_s)^2, since older source frames' stored covariances are
      # stale/over-confident. Only affects pre-selection padding; larger = wider
      # fan (safer, slightly more ICP work).
      fan_drift_trans: 0.01   # m/s  translational drift assumed per second of age
      fan_drift_rot: 0.0017   # rad/s (~0.1 deg/s) rotational drift per second of age
      initialization: true    # global scan-match init before ICP
      initialization_params: [100.0, 5.0, 0.01]  # [sobol n per iter, iters, refine ftol]
      cov_samples: 30
      # sampled = many ICPs + FAST-MCD (default, and the recommended path).
      # `censi` is the legacy planar point-to-point closed form. It is rejected
      # in constrained-3D mode; in planar mode configure() also gates it
      # on the LOADED ICP chain via ICP::error_minimizer_name(), so it is
      # accepted against a PointToPoint minimizer and rejected against
      # PointToPlane. This package's config/icp.yaml ships point-to-plane, so
      # censi is rejected by default; a point-to-point override accepts it.
      # Even when the objectives match, Bonnabel et al. (ACC 2016) show the
      # closed form is optimistic for point-to-point ICP because it ignores
      # rematching — so censi is selectable, not validated.
      cov_method: sampled
      # -- loop-closure defense gates --
      # covariance degeneracy gate: reject closures whose sampled/Censi
      # covariance is too large or too elongated (wall-sliding signature)
      max_sigma: 0.5          # max sqrt(largest translation eigenvalue), m
      max_anisotropy: 8.0     # max sigma_max / sigma_min
      # Evaluate the degeneracy gate on the PRE-floor covariance. The
      # per-eigenvalue floor in compute_icp_with_cov raises the collapsed axis
      # up to the ICP-model sigma before this gate reads it, which caps the
      # observable anisotropy and lets elongated wall-slide covariances
      # through. The in-tree e2e measures false -> 6 closures accepted, 0
      # degenerate rejects, 0.32 m final error; true -> 25 accepted, 16
      # degenerate rejects, 0.01 m. Off by default (a behaviour change on real
      # data) but this is the first knob to try on a doubling bag.
      degeneracy_prefloor: false
      # Overlap must ALSO reach this fraction of the source cloud, not just the
      # absolute min_points count above (rtabmap Icp/CorrespondenceRatio). The
      # count is venue-coupled — 50 points is a lot in a sparse pool and
      # nothing in a cluttered harbour — while the ratio is not. 0 disables.
      min_overlap_ratio: 0.0
      # Revisit FLOOR: a loop-closure target must be at least this many
      # keyframes older than the source, which excludes the current pass's own
      # trail. This is the primary half of the clustered-revisit fix; the
      # contiguous-run clustering refines it, but
      # the floor is what works when the sonar sees the whole venue and the
      # candidates form one unbroken run (a small pool).
      # COUPLED TO min_st_sep above: the exclusion zone builds the candidate
      # pool and this floor then filters it, so once min_revisit_sep >=
      # min_st_sep the floor already excludes everything the zone would have
      # and min_st_sep stops affecting TARGET SELECTION entirely (it still
      # gates when NSSM starts, and still bounds source_frames). The shipped
      # 10 vs 8 is exactly that state, so the node logs a warning at startup —
      # it is legal, just means tuning min_st_sep for doubling will do nothing.
      # Raise min_st_sep above this value to make it bind again.
      min_revisit_sep: 10
      # Disabled by default: magnetic heading is not geometric ground truth.
      max_yaw_vs_compass: 0.0
      # translational analog of the compass gate, for parallel-wall aliasing
      # on symmetric venues: bounds the global-init x/y window AND rejects a
      # final ICP result further than this from the predicted relative pose
      # (ICP can otherwise walk out of a bounded seed into an alias basin).
      # Set just above the real revisit-drift scale; ~1.0 on CHL_Pool.
      # 0 disables both checks — the shipped default, so the lever stays
      # inert until a replay confirms aliasing.
      # Cross-session: after load_map the predictor is the GRAPH estimate, not
      # DR (the two missions' dr_pose values are different epochs and their
      # difference is meaningless). So on a return visit this bound is
      # measured against the relocalized alignment: it must be wide enough to
      # admit the residual relocalization error or no closure onto the loaded
      # map can ever be accepted.
      max_translation_vs_dr: 0.0   # m; 0 disables
      # DCS robust kernel on loop factors — default OFF: it scaled a genuine
      # closure correcting drift D to ~2*phi/(D/sigma)^2 of its weight (0.5%
      # at D=1 m, sigma=5 cm), muting exactly the corrections SLAM exists to
      # make. Outlier protection is the post-loop verify + revert + quarantine.
      use_dcs: false
      dcs_phi: 1.0

    # the PCM params for rejecting outlier loop closures
    pcm_queue_size: 5         # the sliding window size for PCM
    min_pcm: 2                # the min number of pairwise consistent loop closures

    # Magnetic-yaw verification is disabled; chain-tear remains active.
    post_loop_max_yaw_rms: 0.0
    post_loop_max_link_error_sigma: 3.0 # sigma of the link's own noise model (rtabmap RGBD/OptimizeMaxError)
    # extra ISAM2 iterations after inserting loop factors, BEFORE the checks
    # above judge the graph (one Gauss-Newton pass under-converges a large
    # correction and the transient would read as a fold)
    loop_extra_iterations: 3

    # Operator hand-correction: a map-frame planar pose published here
    # (RViz "2D Pose Estimate" publishes /initialpose) becomes a prior on the
    # NEWEST keyframe; the elastic DR chain distributes the correction
    # backwards and the graph assembler re-renders from the republished
    # trajectory. Empty string disables the subscription (and the paired
    # undo service /bruce/slam/slam/undo_manual_correction, which pops the most recent
    # manual prior and relaxes the trajectory back).
    manual_correction_topic: /initialpose
    # operator trust [x m, y m, yaw rad]. Yaw is deliberately soft so a manual
    # rotation does not over-constrain the sequential graph.
    manual_correction_sigmas: [0.2, 0.2, 0.5]

    # ---- map persistence (multi-session) ----
    # /bruce/slam/slam/save_map (std_srvs/Trigger) serializes the whole keyframe map
    # (poses + clouds) here; set map_load_path to that file on a later
    # mission to restore it. A loaded map arms RELOCALIZATION: nothing is
    # published and no factor enters until the first dense candidate frame
    # globally scan-matches into the loaded map (start near previously
    # mapped area). Loop closures then tie the new pass to the old map.
    map_save_path: /tmp/sonar_slam_map.ssm
    map_load_path: ""
    # min fraction of a frame's points that must land on the loaded map for
    # the relocalization to be accepted
    relocalize_min_overlap: 0.5

    # ---- USBL / LBL absolute position input ----
    # Map-frame position fixes become gated position-only priors on the
    # stamp-nearest keyframe (one per keyframe). The fix must be in the SLAM
    # map frame (ENU, matching the rest of the workspace).
    usbl:
      driver: pose_cov     # pose_cov (PoseWithCovarianceStamped) | odom
      topic: ""            # empty disables
      max_innovation: 10.0 # reject fixes farther than this from the estimate
      min_sigma: 0.5       # floor on the per-fix sigma (m)
      max_stamp_delta: 1.0 # max |fix stamp - keyframe stamp| to associate
