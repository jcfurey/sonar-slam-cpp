/**:
  ros__parameters:
    # Constant false alarm rate (CFAR) params for feature extraction
    CFAR:
      Ntc: 40      # number of training cells
      Ngc: 10      # number of guard cells
      Pfa: 0.1     # false alarm rate
      rank: 10     # matrix rank
      alg: 'SOCA'  # method of CFAR, see cfar.cpp for options. SOCA is best.

    # point cloud filtering params
    filter:
      threshold: 65    # the min CFAR response to be added to the point cloud
      resolution: 0.5  # voxel downsampling res
      radius: 1.0      # outlier rejection radius
      min_points: 5    # outlier rejection min points
      skip: 1          # how often to skip a point cloud, use 1

    # are we using compressed imagary
    compressed_images: false

    # ------------------------------------------------------------------------
    # Sonar driver (pluggable adapter, see src/ros/sensors.cpp). Leave 'driver'
    # blank to auto-select the Oculus adapter from compressed_images. For a
    # different vehicle, prefer a payload overlay (config/payloads/*.yaml,
    # docs/PAYLOADS.md).
    #   "" | oculus_compressed | oculus_uncompressed  -> sonar_oculus (vendor)
    #   projected_sonar  -> marine_acoustic_msgs/ProjectedSonarImage (standard;
    #                       modern Blueprint Oculus drivers, e.g. Revolution)
    #   image            -> plain grayscale polar sensor_msgs/Image
    # ------------------------------------------------------------------------
    sonar:
      driver: ""     # see options above
      topic: ""      # "" -> default Oculus topic for the selected mode
      # for driver: image (a plain grayscale polar sensor_msgs/Image):
      # range_resolution: 0.03      # meters per range bin (required)
      # horizontal_fov: 2.2689      # radians across all beams (default 130 deg)
      # range_min: 0.0              # range of image row 0, if not ~zero
