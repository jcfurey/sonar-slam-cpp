# Legacy BlueROV payload overlay (RTI DVL, Bar30 depth, VectorNav VN-100 IMU,
# KVH FOG, Blueprint Oculus via sonar_oculus). This reproduces the historic
# bruce_slam sensor suite explicitly and requires the vendor message packages
# (sonar_oculus, rti_dvl, bar30_depth, kvh_gyro) to be present at build time.
#
# The per-node base configs already default to these drivers, so this overlay
# is mostly documentation / a symmetric counterpart to the other payload
# presets. It deliberately does NOT set use_imu / use_gyro: the BlueROV can run
# any of the four orientation modes, so that choice is left to
# dead_reckoning.yaml (or your own override).
#
#   ros2 launch sonar_slam_cpp slam.launch.xml \
#       payload_config:=$(ros2 pkg prefix --share sonar_slam_cpp)/config/payloads/bluerov_legacy.yaml
#
# See docs/PAYLOADS.md.
/**:
  ros__parameters:
    # active-payload marker (introspection only; no node reads it)
    sonar_slam_payload: bluerov_legacy

    dvl:
      driver: rti_dvl
      topic: /rti/body_velocity/raw
    depth:
      driver: bar30
      topic: /bar30/depth/raw
    imu:
      # legacy VectorNav frame handling (imu_pose roll -90 + fixed offsets)
      driver: vn100
      topic: ""
    imu_pose: [0.0, 0.0, 0.0, -1.5707963267948966, 0.0, 0.0]
    gyro:
      driver: kvh_gyro
      topic: /gyro
    sonar:
      driver: ""          # auto-select the Oculus adapter from compressed_images
      topic: ""
    compressed_images: false
