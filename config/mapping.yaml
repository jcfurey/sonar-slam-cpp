# ROS 2 parameter file for mapping_node (port of bruce_slam mapping.py).
# Keyframe-anchored, loop-closure-correctable map products:
#   * occupancy (additive logodds, from the feature point cloud), and
#   * intensity / backscatter mosaic (from the sonar ping image),
# both re-placed when the pose graph moves a keyframe (see src/core/mapping.cpp).
# The "/**" wildcard applies these to whatever node name loads the file.
/**:
  ros__parameters:
    # ---- georeferenced export (see README "Georeferenced deliverables") ----
    # Survey datum [latitude deg, longitude deg, bearing deg]: bearing is the
    # compass bearing (deg clockwise from true north) of the map +x axis —
    # the vehicle's initial heading, since dead reckoning zeroes yaw on the
    # first attitude sample. With a datum set, the /mapping/export_map
    # service (std_srvs/Trigger) writes <export_prefix>_occupancy.png /
    # _intensity.png with UTM world files (.pgw + .prj; QGIS/ArcGIS load
    # them as georeferenced rasters) and _trajectory.geojson (WGS84).
    # datum: [45.523000, -122.676000, 90.0]
    export_prefix: /tmp/sonar_slam_survey
    # initial map extent + growth (the grid grows automatically as the survey
    # expands past it — these are just the starting allocation)
    origin: [-50.0, -50.0]   # world (x, y) of the grid corner (m)
    size: [100.0, 100.0]     # initial (width, height) (m)
    resolution: 0.2          # m per cell
    inc: 50.0                # grow by this many m when the survey runs off the grid

    # OCCUPANCY (additive logodds, from the feature cloud). Additive — not a
    # clamped update — so a keyframe's contribution can be removed and re-added
    # at its optimized pose when a loop closure moves it.
    pub_occupancy1: true
    hit_prob: 0.8            # occupancy deposited at a return
    miss_prob: 0.3           # occupancy deposited along the free ray before it
    inflation_angle: 0.05    # rad, occupied-cell bearing inflation (Gaussian)
    inflation_range: 0.5     # m,   occupied-cell range inflation (Gaussian)

    # INTENSITY / backscatter mosaic (mean raw echo per cell, 0..100). Also
    # keyframe-anchored and correctable. A survey-grade backscatter deliverable.
    pub_intensity: true

    # radius outlier removal on the feature cloud before marking hits
    outlier_filter_radius: 5.0
    outlier_filter_min_points: 20

    # below this many FILTERED feature points a keyframe deposits a NEUTRAL
    # occupancy tile instead of the upstream all-free wedge — a CFAR whiff must
    # not stamp miss-logodds over real walls (0 = upstream all-free policy)
    free_tile_min_points: 5

    # Only re-place a keyframe's tile once the graph moved it at least this
    # much. Set near the grid resolution: sub-threshold corrections are
    # SILENTLY ABSORBED (the tile stays at its stale pose), so thresholds much
    # larger than a cell re-introduce per-pass ghosting — at the previous
    # 0.5 m / 0.05 rad the map could ghost by half the ~1 m wall-doubling gap
    # the current campaign is chasing (MAP_DOUBLING_FIX_PLAN.md).
    min_translation: 0.2
    min_rotation: 0.02

    # how far (s) a ping/feature stream must advance past a keyframe's stamp
    # before its inputs are declared conclusively lost and the keyframe is
    # skipped with an empty tile (the pairing tolerance itself stays 2 ms)
    stream_grace: 1.0

    # MUST match slam_node's enu_world so the reconstructed sonar fan lands in
    # the same frame as the trajectory poses (true -> standard ENU trajectory).
    enu_world: true

    # optional min seconds between map publishes (0 = publish every keyframe)
    publish_period: 0.0

    # raw sonar ping (same driver/topic as feature_extraction). Left blank here
    # so the sensor-payload overlay sets them, like the other nodes.
    sonar:
      driver: ""    # e.g. "oculus_compressed", "projected_sonar", "image"
      topic: ""     # "" -> the driver's default topic
